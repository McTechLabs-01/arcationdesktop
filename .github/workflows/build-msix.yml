```yaml
name: Build Arcation Desktop MSIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix manifest
        shell: pwsh
        run: |
          $file = "package-clean\AppxManifest.xml"

          if (-not (Test-Path $file)) {
            throw "AppxManifest.xml was not found."
          }

          $text = Get-Content $file -Raw
          $text = $text.Replace('AppListEntry="auto"', 'AppListEntry="default"')
          Set-Content $file $text -Encoding UTF8

          Write-Host "Manifest fixed."

      - name: Find MakeAppx
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter MakeAppx.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\MakeAppx.exe$" } |
            Select-Object -First 1

          if (-not $sdk) {
            throw "MakeAppx.exe was not found."
          }

          "MAKEAPPX=$($sdk.FullName)" >> $env:GITHUB_ENV

          Write-Host "Using $($sdk.FullName)"

      - name: Build MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null

          & "$env:MAKEAPPX" pack `
            /d "$PWD\package-clean" `
            /p "$PWD\build\ArcationDesktop.msix" `
            /o

          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx failed."
          }

      - name: Verify MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\verify | Out-Null

          & "$env:MAKEAPPX" unpack `
            /p "$PWD\build\ArcationDesktop.msix" `
            /d "$PWD\build\verify" `
            /o

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX verification failed."
          }

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ArcationDesktop-MSIX
          path: build/ArcationDesktop.msix
```
